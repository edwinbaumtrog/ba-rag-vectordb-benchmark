services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-0.14.2}
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - /home/idt/ollama:/root/.ollama

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-v0.7.1}
    container_name: open-webui
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_PERSISTENT_CONFIG=False
      - VECTOR_DB=elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX_PREFIX=open_webui_collections
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  esdata: {}
  open-webui: {}
