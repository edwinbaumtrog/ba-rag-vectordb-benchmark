services:
  ollama:
    image: ollama/ollama:0.14.2
    container_name: ollama
    restart: unless-stopped
    tty: true
    volumes:
      - /home/idt/ollama:/root/.ollama

  pgvector:
    image: pgvector/pgvector:pg17-bookworm
    container_name: pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openwebui
    volumes:
      - ./volumes/pgvector:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openwebui"]
      interval: 5s
      timeout: 5s
      retries: 20

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-v0.7.1}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      pgvector:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://postgres:postgres@pgvector:5432/openwebui
      - PGVECTOR_CREATE_EXTENSION=true
      - ENABLE_PERSISTENT_CONFIG=false

volumes:
  open-webui: {}
