services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-0.14.2}
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - /home/idt/ollama:/root/.ollama
  # ---- Open WebUI ----
  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-v0.7.1}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=db4baa16e7e77bb2c384bafed6acb5b32c80b9d36f9402821275b3704f4aa54a
      - VECTOR_DB=chroma
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
